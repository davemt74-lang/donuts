name: Release Package

on:
  push:
    branches:
      - build/section80-deploy-20261006

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cad670eabb0df69797b211814bd04afc92f2f6f3

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite,curl,mbstring

      - name: Create and verify audit database
        run: |
          cp .env.example .env
          mkdir -p storage
          php scripts/migrate.php
          php scripts/migrate.php --status
          php scripts/migrate.php

      - name: Release audit
        run: |
          php scripts/release-audit.php
          php scripts/post-deploy-check.php

      - name: Build deploy package
        run: |
          rm -f .env
          mkdir -p dist/Fudge-Donuts
          rsync -a ./ dist/Fudge-Donuts/             --exclude '.git'             --exclude '.github'             --exclude 'dist'             --exclude '.env'             --exclude 'storage/*.sqlite'             --exclude 'storage/*.sqlite-*'
          cd dist
          zip -rq Fudge-Donuts-Deploy.zip Fudge-Donuts
          sha256sum Fudge-Donuts-Deploy.zip > Fudge-Donuts-Deploy-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fudge-donuts-deploy
          path: |
            dist/Fudge-Donuts-Deploy.zip
            dist/Fudge-Donuts-Deploy-SHA256.txt
