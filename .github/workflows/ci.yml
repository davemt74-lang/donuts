name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite
      - name: Syntax
        run: find src public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Section 2
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section2.php
      - name: Section 3
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section3.php
      - name: Section 4
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section4.php
      - name: Section 5
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section5.php
      - name: Section 6
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section6.php
      - name: Section 7
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section7.php
      - name: Section 8
        run: php -d zend.assertions=1 -d assert.exception=1 tests/section8.php
      - name: Section 9
